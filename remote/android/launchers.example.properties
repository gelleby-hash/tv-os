# The launchers the phone remote knows, in the order its "Connect to" dialog lists them. The first is the one the app
# uses until another is picked. The app may talk unencrypted to these hosts only (and to 127.0.0.1 for testing over
# USB with adb reverse), so a launcher not listed here cannot be reached.
#
# Copy this file to launchers.properties in this folder (git ignores it), put your own launchers in it, and rebuild.
# Without launchers.properties the build uses this file.
#
# One line per launcher: launcher.<number>=<name>|<host>:<port>
# The name may use letters, digits, spaces, hyphens and brackets; the host is an IPv4 address or a host name.
launcher.1=TV|192.168.0.10:47800
launcher.2=Dev PC|192.168.0.20:47800
